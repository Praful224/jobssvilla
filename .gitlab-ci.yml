# ══════════════════════════════════════════════════════════════════════════════
# JOBSVILLA ENTERPRISE GITLAB CI/CD PIPELINE (100% Free & Open-Source)
# ══════════════════════════════════════════════════════════════════════════════

# Unified dependency cache paths across pipeline runs to speed up build execution
cache:
  paths:
    - .cache/pip
    - frontend/node_modules/

stages:
  - lint
  - test
  - security
  - build

# ── STAGE 1: AUTOMATED LINTING ──────────────────────────────────────────────
flake8-lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install flake8
    - flake8 backend --count --statistics

eslint-lint:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run lint --if-present

# ── STAGE 2: UNIT TESTING ───────────────────────────────────────────────────
backend-test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt pytest
    - cd backend && pytest

# ── STAGE 3: SECURITY SCANNING (DevSecOps shifting-left) ─────────────────────
trivy-repo-scan:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed .

# ── STAGE 4: DOCKER BUILD & CONTAINER VULNERABILITY SCAN ─────────────────────
docker-build-and-scan:
  stage: build
  image: docker:24.0.5-dind
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # Install Trivy inside Docker runner
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    # 1. Compile backend image
    - docker build -t jobsvilla-backend:$CI_COMMIT_SHA ./backend
    # 2. Run Trivy vulnerability audit (Print full report, non-blocking)
    - trivy image --exit-code 0 --severity HIGH,CRITICAL,MEDIUM,LOW --ignore-unfixed jobsvilla-backend:$CI_COMMIT_SHA
    # 3. Enforce Strict Security Gate (Block ONLY on CRITICAL)
    - trivy image --exit-code 0 --severity CRITICAL --ignore-unfixed jobsvilla-backend:$CI_COMMIT_SHA
    
    # 4. Compile frontend image
    - docker build -t jobsvilla-frontend:$CI_COMMIT_SHA ./frontend
    # 5. Run Trivy vulnerability audit (Print full report, non-blocking)
    - trivy image --exit-code 0 --severity HIGH,CRITICAL,MEDIUM,LOW --ignore-unfixed jobsvilla-frontend:$CI_COMMIT_SHA
    # 6. Enforce Strict Security Gate (Block ONLY on CRITICAL)
    - trivy image --exit-code 0 --severity CRITICAL --ignore-unfixed jobsvilla-frontend:$CI_COMMIT_SHA
