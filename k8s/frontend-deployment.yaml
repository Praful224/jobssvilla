apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobsvilla-frontend
  namespace: jobsvilla-prod
  labels:
    app: jobsvilla-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobsvilla-frontend
  template:
    metadata:
      labels:
        app: jobsvilla-frontend
    spec:
      containers:
        - name: frontend
          image: jobsvilla-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend:8000"
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 20
